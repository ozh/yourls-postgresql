name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

# Cancel previous runs for the same branch that have not yet completed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
        postgres: ['16', '17', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        ports:
          - 5432/tcp
        env:
          POSTGRES_USER: yourls
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: yourls_tests
        options: >-
          --health-cmd="pg_isready -U yourls"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout yourls-postgresql
        uses: actions/checkout@v6
        with:
          path: yourls-postgresql

      - name: Checkout YOURLS master
        uses: actions/checkout@v6
        with:
          repository: YOURLS/YOURLS
          ref: master
          path: yourls

      - name: Use PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, zip, dom, simplexml, intl, pdo_pgsql
          tools: phpunit
          coverage: none

      - name: Prepare YOURLS test environment
        working-directory: yourls
        run: |
          git clone https://github.com/ozh/YOURLS-fr_FR.git user/languages/fr
          cp user/languages/fr/fr_FR.* user/languages
          cp tests/data/config/yourls-tests-config-ci.php user/config.php

      - name: Drop in db.php
        run: cp yourls-postgresql/db.php yourls/user/db.php

      - name: Run YOURLS test suite
        working-directory: yourls
        run: |
          cd yourls
          phpunit \
            --configuration phpunit.xml.dist \
            --display-skipped \
            --display-incomplete \
            --display-deprecations \
            --display-notices \
            --display-warnings \
            --display-errors
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          DB_USER: yourls
          DB_PASSWORD: secret
          DB_NAME: yourls_tests
